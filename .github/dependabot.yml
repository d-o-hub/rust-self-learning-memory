---
version: 2
updates:
  # Maintain dependencies for Cargo
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
      - "rust"
    commit-message:
      prefix: "chore"
      include: "scope"
    reviewers:
      - "d-o-hub"
    assignees:
      - "d-o-hub"
    groups:
      rust-patch-minor:
        update-types:
          - "minor"
          - "patch"
      rust-major:
        update-types:
          - "major"
    # `chaotic_semantic_memory` pins libsql 0.9.x, and a 0.10+ graph compiles
    # two libsql versions that duplicate the same exported C symbols under
    # `csm` (LESSON-077). The bump is therefore upstream-blocked, and an open
    # pull request deadlocks the release gate — scripts/check-release-blockers.sh
    # refuses to ship while any PR is open — so every such proposal has had to
    # be closed by hand (#1196, #1264). Patches inside 0.9.x still flow.
    ignore:
      - dependency-name: "libsql"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions-all:
        patterns:
          - "*"
