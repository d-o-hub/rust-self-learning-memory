name: Generate Changelog

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to write the section for (must already exist)
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: cargo install git-cliff --locked --version 2.14.2

      - name: Resolve release tag
        env:
          GH_REF: ${{ github.ref }}
          GH_REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${GH_REF#refs/tags/}" = "$GH_REF" ]; then
            candidate="$INPUT_TAG"
          else
            candidate="$GH_REF_NAME"
          fi
          # Fail closed: an unbounded or non-release ref must not be rendered as
          # a version section (issue #1178). Event data stays out of the shell
          # until it matches this literal release-tag shape.
          if ! printf '%s' "$candidate" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::not a release tag: '$candidate' (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          echo "CLIFF_TAG=$candidate" >> "$GITHUB_ENV"

      - name: Generate changelog
        # The script owns idempotency: it skips when the release-preparation PR
        # already wrote this version's section, and fails on a file that
        # parse-changelog would reject. Do not call git-cliff from here — #1186
        # proved the workflow and the documented pre-release hook drift apart.
        run: ./scripts/update-changelog.sh --tag "$CLIFF_TAG"

      - name: Create Pull Request for updated changelog
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          commit-message: "chore(changelog): update CHANGELOG.md for ${{ env.CLIFF_TAG }}"
          title: "chore(changelog): update CHANGELOG.md for ${{ env.CLIFF_TAG }}"
          body: "Automated update of CHANGELOG.md."
          branch: "chore/update-changelog-${{ env.CLIFF_TAG }}"
          base: main
          labels: automated-pr
