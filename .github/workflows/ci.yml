---
name: CI
permissions:
  contents: read
  checks: write
  security-events: write

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual CI run'

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Same-run fast gate (ADR-079 CIT-A1): commitlint and fast-gate run inside
  # this workflow, so the CI / Required aggregate observes their true results.
  # No cross-workflow waiter remains; a failed fast gate skips the substantive
  # jobs and the aggregate fails closed on the skipped result.

  commitlint:
    name: Commit Message Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Install commitlint
        run: |
          npm install --save-dev @commitlint/cli @commitlint/config-conventional

      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        run: |
          npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Validate push commits
        if: github.event_name == 'push'
        run: |
          npx commitlint --from ${{ github.event.before }} --to ${{ github.sha }} --verbose

      - name: No commit range for manual runs
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "workflow_dispatch: no commit range to validate"

  fast-gate:
    name: Quick PR Check (Format + Clippy)
    runs-on: ubuntu-latest
    # Cold cache + doctests often exceed 15m; downstream same-run jobs depend on
    # this job, so the aggregate observes its true result.
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          job-name: quick-check
          components: rustfmt, clippy

      - name: Validate YAML frontmatter
        run: |
          chmod +x scripts/check-yaml-frontmatter.sh
          ./scripts/check-yaml-frontmatter.sh

      - name: Check formatting
        run: ./scripts/code-quality.sh fmt --workspace

      - name: Run clippy (workspace)
        run: ./scripts/code-quality.sh clippy --workspace

      - name: Run documentation tests
        run: |
          chmod +x scripts/*.sh
          ./scripts/check-doctests.sh

      - name: Check ignored-test ceiling
        run: |
          chmod +x scripts/check-ignored-tests.sh
          ./scripts/check-ignored-tests.sh

  # Core testing - optimized for speed with proper timeouts
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [fast-gate, commitlint]
    timeout-minutes: 30
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache/* || true
          sudo apt-get clean || true
          df -h
      - name: Maximize build space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          job-name: ci-test
          install-nextest: "true"

      - name: Run tests with timeout protection
        run: |
          # Run the practical workspace test surface for required CI checks.
          # Intentionally exclude benches/examples/do-memory-test-utils from required PR gating
          # to keep runtime stable while still covering unit + integration tests.
          nix develop --command cargo nextest run --profile ci --workspace \
            --exclude do-memory-benches \
            --exclude do-memory-examples \
            --exclude do-memory-test-utils
      - name: Upload nextest JUnit (test)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-junit-test
          path: ${{ env.CARGO_TARGET_DIR }}/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 7

  # MCP builds - simplified with timeout protection
  mcp-build:
    name: MCP Build
    runs-on: ubuntu-latest
    needs: [fast-gate, commitlint]
    timeout-minutes: 30
    steps:
      - name: Free disk space for WASM builds
        run: |
          sudo rm -rf /opt/hostedtoolcache/*/12.* 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet/ 2>/dev/null || true
          sudo rm -rf /usr/local/lib/android/ 2>/dev/null || true
          sudo rm -rf /opt/ghc/ 2>/dev/null || true
          docker system prune -af 2>/dev/null || true
          df -h
      - name: Maximize build space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          job-name: ci-mcp-build
          install-nextest: "true"
          save-cache: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}

      - name: Build and test (default)
        run: |
          timeout 600s nix develop --command cargo build -p do-memory-mcp || exit 1
          timeout 600s nix develop --command cargo nextest run --profile ci -p do-memory-mcp || exit 1
      - name: Upload nextest JUnit (mcp-build)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-junit-mcp-build
          path: ${{ env.CARGO_TARGET_DIR }}/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 7

  # Multi-platform testing - simplified matrix
  multi-platform:
    name: Multi-Platform Test
    runs-on: ${{ matrix.os }}
    needs: [fast-gate, commitlint]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Maximize build space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Nix
        if: matrix.os == 'ubuntu-latest'
        uses: ./.github/actions/setup-nix

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          job-name: ci-multi-platform-${{ matrix.os }}
          install-nextest: "true"
          save-cache: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}

      - name: Run tests on ${{ matrix.os }}
        run: |
          # Cross-platform timeout wrapper with extended time (1800s = 30min)
          # macOS has `gtimeout` from coreutils, or use perl as fallback
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            if command -v timeout >/dev/null 2>&1; then
              timeout 1800s nix develop --command cargo nextest run --profile ci --workspace --exclude do-memory-benches --exclude do-memory-examples --exclude do-memory-test-utils
            else
              nix develop --command cargo nextest run --profile ci --workspace --exclude do-memory-benches --exclude do-memory-examples --exclude do-memory-test-utils
            fi
          else
            if command -v timeout >/dev/null 2>&1; then
              # Linux with GNU timeout
              timeout 1800s cargo nextest run --profile ci --workspace --exclude do-memory-benches --exclude do-memory-examples --exclude do-memory-test-utils
            elif command -v gtimeout >/dev/null 2>&1; then
              # macOS with GNU timeout (coreutils)
              gtimeout 1800s cargo nextest run --profile ci --workspace --exclude do-memory-benches --exclude do-memory-examples --exclude do-memory-test-utils
            else
              # macOS fallback: use perl for portable timeout
              # Use -- to separate perl args from command args
              perl -e 'alarm 1800; exec @ARGV' -- cargo nextest run --profile ci --workspace --exclude do-memory-benches --exclude do-memory-examples --exclude do-memory-test-utils
            fi
          fi
      - name: Upload nextest JUnit (multi-platform)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-junit-multi-platform-${{ matrix.os }}
          path: ${{ env.CARGO_TARGET_DIR }}/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 7

  # Quality gates - final validation
  # NOTE: This job is NOT in the needs: list of other jobs to prevent blocking
  # Coverage is collected separately in coverage.yml workflow
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # Required for Codecov OIDC authentication
    timeout-minutes: 45    # Increased from 30 to accommodate slow coverage
    needs: [fast-gate, commitlint, test, mcp-build, multi-platform]
    steps:
      - name: Maximize build space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          job-name: ci-quality-gates
          components: clippy, rustfmt, llvm-tools-preview
          install-llvm-cov: "true"
          save-cache: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}

      - name: Install required tools
        run: |
          nix develop --command cargo install --locked cargo-deny || cargo install --locked cargo-deny
          # cargo-audit is optional structured reporting; cargo-deny is the
          # authoritative blocking advisory check (W2.2 / S1.6 gate hygiene).
          nix develop --command cargo install --locked cargo-audit || cargo install --locked cargo-audit || true
        shell: bash

      - name: Security Audit (blocking)
        run: |
          set -euo pipefail
          # W2.2: do not soft-pass on advisory failures. cargo-deny is blocking.
          timeout 1200s nix develop --command cargo deny check advisories
          # Optional cargo-audit JSON report when the tool can parse the DB.
          # Fail only when audit completes and reports vulnerabilities > 0.
          # Tool/DB parse failures must not greenwash after deny already passed.
          set +e
          timeout 600s nix develop --command cargo audit --json > audit-report.json 2>audit-err.txt
          audit_rc=$?
          set -e
          if [ "$audit_rc" -eq 0 ] && [ -f audit-report.json ]; then
            count=$(jq -r '.vulnerabilities.count // 0' audit-report.json)
            if [ "${count}" -gt 0 ]; then
              echo "cargo audit found ${count} vulnerabilities"
              cat audit-report.json
              exit 1
            fi
            echo "cargo audit: 0 vulnerabilities"
          else
            echo "cargo audit unavailable or failed to parse advisory DB (rc=${audit_rc}); cargo deny already enforced"
            cat audit-err.txt || true
          fi
        env:
          RUST_LOG: info
      - name: Coverage Check (Workspace, PR-aligned)
        run: |
          # Coverage check with 40 minute timeout
          # Use --workspace so Codecov patch status can map PR diff lines correctly.
          # Exclude heavy non-gating crates to keep runtime reasonable.
          timeout 2400s nix develop --command cargo llvm-cov --workspace \
            --exclude do-memory-benches \
            --exclude do-memory-examples \
            --exclude do-memory-test-utils \
            --lcov --output-path lcov.info --jobs 4
        env:
          RUST_LOG: info
      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./lcov.info
          fail_ci_if_error: false

  # Semver compatibility check - prevents accidental breaking changes
  semver-check:
    name: Semver Check
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Increased from 15 - workspace rustdoc builds are slow
    steps:
      - name: Maximize build space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Required for --baseline-branch

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          job-name: ci-semver-check
          save-cache: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}

      - name: Cache semver baseline
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.1
        with:
          path: |
            ~/.cargo/semver-checks
            target/semver-checks
          key: semver-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ github.base_ref || 'main' }}
          restore-keys: |
            semver-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-
            semver-${{ runner.os }}-
      - name: Install cargo-semver-checks
        run: nix develop --command cargo install --locked cargo-semver-checks || cargo install --locked cargo-semver-checks
        shell: bash
      - name: Check semver compatibility
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # Use baseline caching for PRs - compare against main branch
            nix develop --command cargo semver-checks check-release --workspace --baseline-branch main
          else
            # Full check for main/develop branch pushes
            nix develop --command cargo semver-checks check-release --workspace
          fi
        continue-on-error: true  # Informational only, not blocking

  # WASM compile check - ensures memory-core compiles for wasm32 targets
  wasm-check:
    name: WASM Compile Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Maximize build space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          job-name: ci-wasm-check
          save-cache: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Check WASM compilation
        run: cargo check -p do-memory-core --target wasm32-unknown-unknown --no-default-features --features wasm32
        env:
          # getrandom 0.3.x requires this cfg flag for wasm32-unknown-unknown support
          # getrandom 0.2.x uses the "js" feature (enabled via target dep in Cargo.toml)
          RUSTFLAGS: "-D warnings --cfg getrandom_backend=\"wasm_js\""

  # CI / Required - stable same-run aggregate context (ADR-079 CIT-A1, workflow
  # side; ruleset migration is a separate staged step needing maintainer
  # approval). The aggregate accepts ONLY success results: failure, cancelled,
  # timed_out, or skipped dependencies fail the gate (fail-closed). Results are
  # mapped by scripts/ci-required-evaluate.sh, the single result-mapping
  # authority. Because the fast gate (commitlint + fast-gate) is a same-run
  # dependency, a failed fast gate skips the substantive jobs and the aggregate
  # reports the skipped result as a failure instead of a warning.
  required:
    name: CI / Required
    runs-on: ubuntu-latest
    needs: [fast-gate, commitlint, test, mcp-build, multi-platform, quality-gates]
    if: always()
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Evaluate required aggregate
        run: |
          chmod +x scripts/ci-required-evaluate.sh
          ./scripts/ci-required-evaluate.sh \
            "Fast Gate=${{ needs.fast-gate.result }}" \
            "Commit Message Lint=${{ needs.commitlint.result }}" \
            "Tests=${{ needs.test.result }}" \
            "MCP Build=${{ needs.mcp-build.result }}" \
            "Multi-Platform=${{ needs.multi-platform.result }}" \
            "Quality Gates=${{ needs.quality-gates.result }}"
