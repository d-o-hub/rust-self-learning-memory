name: CodeQL

# Advanced setup replaced GitHub's CodeQL default setup on 2026-11-05.
#
# Why: default setup's improved incremental (overlay) analysis failed on the
# Python analysis of main with a disk-space error ("This job attempted to run
# with improved incremental analysis but it did not complete successfully").
# Overlay analysis needs ~14 GB free; the standard runner sits near that line.
# The documented `github-codeql-disable-overlay` repository property is
# org-only, and this repository is user-owned, so the only controllable fix is
# advanced setup with a disk-cleanup step. See
# https://docs.github.com/en/code-security/reference/code-scanning/troubleshoot-analysis-errors/out-of-disk-or-memory
#
# Languages and categories match the previous default setup (actions, python,
# rust), so existing code-scanning alerts keep their identity.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze-interpreted:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Overlay analysis uses git history; a full clone keeps it available.
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"

  analyze-rust:
    name: Analyze (rust)
    runs-on: ubuntu-latest
    # The rust database is the slowest of the three on a cold runner.
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: rust
          # Rust is supported in `none` build mode, which is what default setup
          # used; no cargo build is needed for database creation.
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:rust"
