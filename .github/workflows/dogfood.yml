---
# Dogfood the product the way an agent uses it: CLI lifecycle, local durable
# storage, cross-process pattern/storage parity, tags/journal, the MCP stdio
# surface, and the memory-harness skill scripts. Runs weekly and on demand;
# it is not a required PR check (the binary build is too heavy for every PR).
name: Dogfood Coding Workflow

"on":
  schedule:
    # Weekly, Monday 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dogfood:
    name: CLI + DB + MCP + skills
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          job-name: dogfood
          install-nextest: "false"
          save-cache: "false"

      - name: Install skill-eval tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq ripgrep

      - name: Run dogfood gate
        run: |
          set -euo pipefail
          nix develop --command bash scripts/dogfood-coding-workflow.sh \
            --quick --skip-harness
