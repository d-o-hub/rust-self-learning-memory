name: "Mutation Testing"

# Mutation testing for core learning and retrieval logic.
# Validates that tests catch injected faults in the most critical modules:
#   - reward scoring (learning signal quality)
#   - retrieval (memory recall correctness)
#   - retry (resilience logic)
#   - patterns (pattern extraction accuracy)
#
# Threshold Strategy (Issue #747):
#   Phase 1 (current): Informational only (continue-on-error: true)
#     - Establish baseline mutation scores per module
#     - Track trends via artifact history
#   Phase 2 (future): Enforce minimum mutation score (60%)
#     - Fail CI if mutation score drops below threshold
#     - Ratchet up threshold as test quality improves
#   Phase 3 (target): 80%+ mutation kill rate for critical modules
#
# See: https://github.com/d-o-hub/rust-self-learning-memory/issues/747

on:
  schedule:
    # Weekly: Sundays at 3 AM UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      timeout:
        description: 'Per-mutant timeout in seconds'
        required: false
        default: '60'
  push:
    branches: [main]
    paths:
      - 'memory-core/src/reward/**'
      - 'memory-core/src/retrieval/**'
      - 'memory-core/src/retry/**'
      - 'memory-core/src/patterns/**'

permissions:
  contents: read

concurrency:
  group: mutation-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  mutation-testing:
    name: "Mutants: ${{ matrix.module }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60        # ← per shard, not total
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        module:
          - reward
          - retrieval
          - retry
          - patterns

    steps:
      - name: Maximize build space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          job-name: mutation-${{ matrix.module }}
          save-cache: "true"

      - name: Install cargo-mutants (cached)
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2
        with:
          tool: cargo-mutants   # uses prebuilt binary, ~seconds not minutes

      - name: Run mutation testing – ${{ matrix.module }}
        run: |
          TIMEOUT="${{ github.event.inputs.timeout || '60' }}"
          echo "=== Mutants: memory-core/src/${{ matrix.module }} ==="
          cargo mutants \
            --package do-memory-core \
            --timeout "$TIMEOUT" \
            --jobs 4 \
            --file "memory-core/src/${{ matrix.module }}/**/*.rs" \
            --output "mutants-${{ matrix.module }}.out" \
            -- --lib
        continue-on-error: true

      - name: Upload shard report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-${{ matrix.module }}
          path: mutants-${{ matrix.module }}.out/
          retention-days: 30
          if-no-files-found: warn

  summarize:
    name: "Mutation Summary"
    runs-on: ubuntu-latest
    needs: mutation-testing
    if: always()
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mutation-*
          merge-multiple: false
          path: all-mutants/

      - name: Aggregate results
        run: |
          echo "### 🧬 Mutation Testing Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Module | Killed | Survived | Timeouts | Total |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|--------|----------|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          for dir in all-mutants/mutation-*/; do
            if [ -d "$dir" ]; then
              MODULE=$(basename "$dir" | sed 's/mutation-//')
              if [ -f "$dir/mutants.json" ]; then
                KILLED=$(jq '[.outcomes[] | select(.scenario != "Baseline") | select(.summary == "CaughtMutant")] | length' "$dir/mutants.json" 2>/dev/null || echo "0")
                SURVIVED=$(jq '[.outcomes[] | select(.scenario != "Baseline") | select(.summary == "MissedMutant")] | length' "$dir/mutants.json" 2>/dev/null || echo "0")
                TIMEOUTS=$(jq '[.outcomes[] | select(.scenario != "Baseline") | select(.summary == "Timeout")] | length' "$dir/mutants.json" 2>/dev/null || echo "0")
                TOTAL=$((KILLED + SURVIVED + TIMEOUTS))
                echo "| **$MODULE** | $KILLED | $SURVIVED | $TIMEOUTS | $TOTAL |" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "| **$MODULE** | N/A | N/A | N/A | N/A (mutants.json missing) |" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "*Phase 1 (informational). Future: enforce 60% min → 80% target.*" >> "$GITHUB_STEP_SUMMARY"
