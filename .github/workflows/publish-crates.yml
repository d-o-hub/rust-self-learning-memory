---
# Ordered crates.io publish chain: core -> redb -> turso -> mcp.
# The per-crate gates and the OIDC-authenticated publish live in the
# `.github/actions/publish-crate` composite action.
#
# Authentication is crates.io Trusted Publishing: no long-lived token is read
# from repository secrets. crates.io validates the workflow filename
# (`publish-crates.yml`) and the job `environment` (`crates.io`), so every
# trusted-publisher config must use exactly those values.
name: Publish to crates.io

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (no actual publish)'
        required: false
        default: 'true'
        type: boolean
      crate:
        description: 'Specific crate to publish (empty = all)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  # Publish do-memory-core first - other crates depend on it
  publish-core:
    name: Publish do-memory-core
    runs-on: ubuntu-latest
    environment: crates.io
    permissions:
      id-token: write
      contents: read
    if: ${{ (github.event_name == 'release' || github.event_name == 'workflow_dispatch') && (inputs.crate == '' || inputs.crate == 'do-memory-core') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          job-name: setup

      - name: Publish crate
        uses: ./.github/actions/publish-crate
        with:
          crate: do-memory-core
          dry-run: ${{ inputs.dry-run == true }}
          single-crate-dispatch: ${{ inputs.crate != '' }}

  # Publish do-memory-storage-redb after core (no internal dependencies)
  publish-redb:
    name: Publish do-memory-storage-redb
    runs-on: ubuntu-latest
    environment: crates.io
    permissions:
      id-token: write
      contents: read
    needs: [publish-core]
    # always() + explicit result checks: a dispatch that selects one crate
    # skips the other jobs, and a skipped prerequisite must not silently skip
    # the requested crate - the composite's dependency-closure gate decides.
    if: ${{ always() && (github.event_name == 'release' || github.event_name == 'workflow_dispatch') && (inputs.crate == '' || inputs.crate == 'do-memory-storage-redb') && (needs.publish-core.result == 'success' || needs.publish-core.result == 'skipped') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          job-name: setup

      - name: Publish crate
        uses: ./.github/actions/publish-crate
        with:
          crate: do-memory-storage-redb
          dry-run: ${{ inputs.dry-run == true }}
          single-crate-dispatch: ${{ inputs.crate != '' }}

  # Publish do-memory-storage-turso after redb (depends on redb)
  publish-turso:
    name: Publish do-memory-storage-turso
    runs-on: ubuntu-latest
    environment: crates.io
    permissions:
      id-token: write
      contents: read
    needs: [publish-redb]
    if: ${{ always() && (github.event_name == 'release' || github.event_name == 'workflow_dispatch') && (inputs.crate == '' || inputs.crate == 'do-memory-storage-turso') && (needs.publish-redb.result == 'success' || needs.publish-redb.result == 'skipped') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          job-name: setup

      - name: Publish crate
        uses: ./.github/actions/publish-crate
        with:
          crate: do-memory-storage-turso
          dry-run: ${{ inputs.dry-run == true }}
          single-crate-dispatch: ${{ inputs.crate != '' }}

  # Publish do-memory-mcp after turso (depends on redb + turso)
  publish-mcp:
    name: Publish do-memory-mcp
    runs-on: ubuntu-latest
    environment: crates.io
    permissions:
      id-token: write
      contents: read
    needs: [publish-redb, publish-turso]
    if: ${{ always() && (github.event_name == 'release' || github.event_name == 'workflow_dispatch') && (inputs.crate == '' || inputs.crate == 'do-memory-mcp') && (needs.publish-redb.result == 'success' || needs.publish-redb.result == 'skipped') && (needs.publish-turso.result == 'success' || needs.publish-turso.result == 'skipped') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          job-name: setup

      - name: Publish crate
        uses: ./.github/actions/publish-crate
        with:
          crate: do-memory-mcp
          dry-run: ${{ inputs.dry-run == true }}
          single-crate-dispatch: ${{ inputs.crate != '' }}
