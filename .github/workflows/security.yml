---
name: Security

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

# Never cancel security scans in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secret-scan:
    name: Secret Scanning
    permissions:
      contents: read
      security-events: write  # Required for gitleaks-action SARIF uploads
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # Optional: for premium features

  # Dependency Review requires GitHub Advanced Security (not available on this repo)
  # Commenting out to prevent workflow failures
  # dependency-review:
  #   name: Dependency Review
  #   runs-on: ubuntu-latest
  #   permissions:
  #     contents: read
  #   if: github.event_name == 'pull_request'
  #   timeout-minutes: 10
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
  #     - uses: actions/dependency-review-action@v4.8.2
  #       with:
  #         fail-on-severity: moderate

  supply-chain-audit:
    name: Supply Chain Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          job-name: security-supply-chain-audit

      - name: Install cargo-deny and cargo-audit
        run: |
          cargo install cargo-deny --locked
          cargo install cargo-audit --locked || true

      - name: Run dependency security audit (root and fuzz graphs)
        run: |
          set -euo pipefail
          # Canonical multi-lockfile security audit entrypoint
          bash scripts/check-dependency-audit.sh

      - name: Upload audit report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: security-audit-report
          path: |
            audit-report-root.json
            audit-report-fuzz.json
          retention-days: 30

      - name: Post audit summary
        if: always()
        run: |
          echo "## Security Audit" >> $GITHUB_STEP_SUMMARY
          echo "Audited lockfiles: \`Cargo.lock\` (root) and \`fuzz/Cargo.lock\` (fuzz)" >> $GITHUB_STEP_SUMMARY
          if [ -f audit-report-root.json ]; then
            echo "- Root (\`Cargo.lock\`): $(cat audit-report-root.json | jq -r '.vulnerabilities.count // "n/a"') vulnerabilities" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f audit-report-fuzz.json ]; then
            echo "- Fuzz (\`fuzz/Cargo.lock\`): $(cat audit-report-fuzz.json | jq -r '.vulnerabilities.count // "n/a"') vulnerabilities" >> $GITHUB_STEP_SUMMARY
          fi

  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
