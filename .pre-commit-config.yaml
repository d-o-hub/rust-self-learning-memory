# Pre-commit hooks for CI parity
# Install: ./scripts/install-hooks.sh   (equivalently: pip install pre-commit, then
#          pre-commit install --hook-type pre-commit --hook-type commit-msg)
# Run manually: pre-commit run --all-files
# Run the opt-in heavy hooks: pre-commit run --hook-stage manual --all-files

repos:
  - repo: local
    hooks:
      # Format check - matches CI 'cargo fmt --all -- --check'
      - id: fmt
        name: Format (cargo fmt)
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false

      # LOC invariant - do-harness 'loc' sensor (scripts/check-loc.sh)
      # Also available standalone: do-harness verify --only loc
      - id: loc
        name: LOC (<=500 per source file)
        entry: bash scripts/check-loc.sh
        language: system
        pass_filenames: false

      # Clippy on lib + tests - matches CI quick-check.yml.
      # Kept in the manual stage: two workspace clippy passes per commit is minutes of
      # latency, which is why these hooks went uninstalled and AGENTS.md described the
      # commit subset as "fmt + loc". Run them explicitly with
      # `pre-commit run --hook-stage manual --all-files`, or via ./scripts/code-quality.sh.
      - id: clippy-lib
        name: Clippy (lib)
        entry: cargo clippy --lib -- -D warnings -A clippy::expect_used -A clippy::uninlined_format_args -A clippy::unwrap_used
        language: system
        pass_filenames: false
        stages: [manual]

      - id: clippy-tests
        name: Clippy (tests)
        entry: cargo clippy --tests -- -D warnings -A clippy::expect_used -A clippy::uninlined_format_args -A clippy::unwrap_used
        language: system
        pass_filenames: false
        stages: [manual]

  # Optional: Standard hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-merge-conflict

  # Commit message linting
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.5.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ['--severity=warning']
        files: '^scripts/.*\.sh$'

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ['-c', '.yamllint.yml', '--strict']
        files: '\.(ya?ml)$'
        exclude: '(node_modules/|\.github/workflows/)'
