[book]
title = "Self-Learning Memory System"
authors = ["d-o-hub"]
description = "Documentation for the Self-Learning Memory System"
language = "en"
src = "src"

[build]
build-dir = "book"
# Kept true so new chapters can be added by hand, but it makes `mdbook build`
# resolve a SUMMARY.md anchor placeholder (`- [Title](#architecture)`) as a
# *path* and create `book/src/#architecture` — which a `git add -A` then commits
# (LESSON-033). Placeholder chapters must use mdBook draft syntax `- [Title]()`,
# and `git status` must be checked before staging after any book build.
create-missing = true

[output.html]
git-repository-url = "https://github.com/d-o-hub/rust-self-learning-memory"
edit-url-template = "https://github.com/d-o-hub/rust-self-learning-memory/edit/main/book/{path}"

[output.html.search]
enable = true