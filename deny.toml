# cargo-deny configuration for supply chain security
# https://embarkstudios.github.io/cargo-deny/

# Note: All fields are optional, this is the default configuration

[advisories]
# The advisories section is for detecting security vulnerabilities
# Use version 2 for new configuration format
version = 2
unmaintained = "workspace"  # Only error if crate is a direct dependency
yanked = "deny"
ignore = [
    # RUSTSEC-2026-0049: rustls-webpki CRL matching logic flaw
    # Dependency chain: libsql 0.9.30 -> hyper-rustls 0.25 -> rustls 0.22 -> rustls-webpki 0.102.8
    # Fix: rustls-webpki >=0.103.10 (semver-incompatible with rustls 0.22's ^0.102.8 constraint)
    # Upstream: Requires libsql to migrate from hyper-rustls 0.25 (hyper 0.14) to 0.27 (hyper 1.x)
    # Tracking: https://github.com/rustls/webpki/releases/tag/v/0.103.10
    # Mitigation: CRL matching flaw is low impact; CRL validation not relied upon in our usage
    "RUSTSEC-2026-0049",
    # RUSTSEC-2026-0099: rustls-webpki name constraints for wildcard names incorrectly accepted
    # Dependency chain: libsql 0.9.30 -> hyper-rustls 0.25 -> rustls 0.22 -> rustls-webpki 0.102.8
    # Fix: rustls-webpki >=0.103.12 OR >=0.104.0-alpha.6 (semver-incompatible)
    # Date: 2026-04-14
    # Mitigation: Transitive dependency, awaiting libsql upstream update
    "RUSTSEC-2026-0099",
    # RUSTSEC-2026-0098: rustls-webpki name constraints for URI names incorrectly accepted
    # Same dependency chain and fix as RUSTSEC-2026-0099
    # Date: 2026-04-14
    "RUSTSEC-2026-0098",
    # RUSTSEC-2026-0104: rustls-webpki reachable panic in CRL parsing
    # Dependency chain: libsql 0.9.30 -> hyper-rustls 0.25 -> rustls 0.22 -> rustls-webpki 0.102.8
    # Fix: rustls-webpki >=0.103.13 OR >=0.104.0-alpha.7 (semver-incompatible)
    # Date: 2026-04-22
    # Mitigation: Applications that do not use CRLs are not affected
    "RUSTSEC-2026-0104",

    # RUSTSEC-2023-0071: rsa vulnerability (Marvin Attack)
    # Dependency chain: jsonwebtoken 10.3.0 -> rsa 0.9.10
    # Mitigation: do-memory-mcp uses HMAC (HS256) exclusively, not RSA.
    # rsa is a transitive dependency of jsonwebtoken we don't directly use.
    "RUSTSEC-2023-0071",

    # RUSTSEC-2026-0258: h2 unbounded empty DATA frames
    # Dependency chain: libsql 0.9.30 -> hyper-rustls 0.25 -> hyper 0.14 -> h2 0.3.27
    # Fix: Patched in h2 >=0.4.16 (h2 0.3.27 in hyper 0.14 is unpatched)
    # Mitigation: Transitive dependency via hyper 0.14, awaiting libsql upstream update to hyper 1.x
    "RUSTSEC-2026-0258",

    # RUSTSEC-2026-0346: derived Debug impls on Tls12/Tls13ClientSessionValue leak the
    # TLS 1.2 master secret / TLS 1.3 resumption PSK.
    # Dependency chain: libsql 0.9.30 -> hyper-rustls 0.25.0 -> rustls 0.22.4
    # Fix: rustls >=0.23.46 (the 0.23 line is bumped in this change; 0.22.4 is the final
    # release of the 0.22 series, so this chain has no in-place patch)
    # Upstream: Requires libsql to migrate off hyper-rustls 0.25, same blocker as
    # RUSTSEC-2026-0049/0099/0104/0258
    # Mitigation: Applies only to *custom* ClientSessionStore implementations that format
    # these values with Debug; the built-in cache output is already redacted. This workspace
    # declares no ClientSessionStore/ClientSessionValue, so rustls's redacted built-in store
    # is the only one in use.
    "RUSTSEC-2026-0346",

    # RUSTSEC-2026-0349: client records the server-selected key exchange group before the
    # server is authenticated, so a network attacker can downgrade later connections to
    # classical key exchange. Impact is loss of post-quantum confidentiality only: no key
    # compromise, no authentication bypass.
    # Dependency chain, fix and upstream blocker as RUSTSEC-2026-0346
    # Mitigation: The downgrade targets the X25519MLKEM768 hybrid group, which does not exist
    # in the 0.22 series (absent from rustls-0.22.4/src, first added in 0.23), so the 0.22.4
    # chain never offers the group whose prediction can be poisoned. The 0.23 line is patched
    # by this change.
    "RUSTSEC-2026-0349",

    # RUSTSEC-2026-0382: rustls-webpki may accept certificate paths containing distrusted
    # emSign intermediates when the configured trust anchors allow such paths. The private keys
    # for those intermediates are now well known.
    # Dependency chain: libsql 0.9.30 -> hyper-rustls 0.25 -> rustls 0.22 -> rustls-webpki 0.102.8
    # Fix: rustls-webpki >=0.103.16 (semver-incompatible with rustls 0.22's ^0.102.8 constraint)
    # Upstream blocker: requires libsql to migrate from hyper-rustls 0.25 (hyper 0.14) to a
    # hyper 1.x line; rustls 0.22 pins rustls-webpki to the 0.102 series.
    # Mitigation: the 0.102.8 chain is the only one that cannot take the patched webpki, and
    # the direct rustls-webpki dependency is at 0.103.16 (patched). The exposure is the
    # transitive libsql/hyper-rustls path only.
    "RUSTSEC-2026-0382",

    # RUSTSEC-2026-0387: crypto-bigint timing variability in constant-time operations
    # Dependency chain: jsonwebtoken 11.1.0 -> p256/p384 -> ecdsa -> elliptic-curve 0.13.8 -> crypto-bigint 0.5.5
    # Fix: crypto-bigint >=0.7.6 (semver-incompatible with elliptic-curve 0.13.8's crypto-bigint 0.5 constraint)
    # Mitigation: Transitive dependency of jsonwebtoken (p256/p384 feature); do-memory-mcp uses HS256 HMAC exclusively.
    "RUSTSEC-2026-0387",
]

[licenses]
# The licenses section is for detecting incompatible licenses
# Use version 2 for new configuration format
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
    "Zlib",
    "BSL-1.0",
    "OpenSSL",
    "MPL-2.0",
    "NCSA",
]
exceptions = [
    { name = "colored", allow = ["MPL-2.0"] },
    { name = "option-ext", allow = ["MPL-2.0"] },
    { name = "bitmaps", allow = ["MPL-2.0"] },
    { name = "im-rc", allow = ["MPL-2.0"] },
    { name = "sized-chunks", allow = ["MPL-2.0"] },
]
# Note: In version 2, all licenses not in 'allow' list are automatically denied

[bans]
# The bans section is for detecting multiple versions of the same crate
multiple-versions = "allow"  # Changed from "warn" to "allow" temporarily
wildcards = "allow"  # Changed from "deny" to "allow" to be more permissive
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = [
    # Deny old unmaintained crates
    { name = "chrono", version = "<0.4" },
]
skip = [
    # Allow multiple versions of zerocopy (known issue with dependencies)
    { name = "zerocopy" },
]

[sources]
# The sources section is for detecting where dependencies come from
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
