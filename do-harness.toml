# do-harness.toml — sensor pack for this workspace.
#
# Sensors mirror the repo's own quality gates (AGENTS.md "Required Checks
# Before Commit") without duplicating their configuration: CI still runs
# the same commands; do-harness adds local beats, strikes, and task gating.
#
# Every sensor MUST declare `inputs`. Without it the harness falls back to
# `input:git-index-and-nonignored-untracked`, which records a null digest in
# `.do-harness/evidence.*.json` (`input_manifest.sensors: {<name>: null}`), and
# `do-harness status --set <set>` then reports
# `stale (inputs_changed_or_unknown)` for every change — including a no-op on a
# clean tree — so the "confirm green local evidence boundary" step of the
# completion contract can never pass. Declared globs are gitignore-aware
# (`target/` is ignored, so build output never invalidates evidence), and a
# pattern matching no file records a null digest too, and an empty `inputs = []`
# takes the same null-digest fallback as omitting the key (measured on 0.4.1:
# the declaration stays `input:git-index-and-nonignored-untracked`), which is why
# `check-do-harness-doctrine.sh` rejects both a missing and an empty list and
# requires every declared pattern to match at least one file.
language = "rust"

[hooks]
pre-commit = ["fmt", "loc"]
pre-push = []

[signal-sets]
feedback = ["fmt", "loc", "check", "commit-ci-tokens", "agents-md-ids"]
verification = [
  "fmt",
  "check",
  "clippy",
  "loc",
  "deny",
  "lockfile-sync",
  "changelog-headings",
  "shell-counters",
  "lesson-distillation",
  "commit-ci-tokens",
  "agents-md-ids",
  "merge-method",
  "release-blockers",
  "harness-compat",
  "harness-doctrine",
  "docs",
  "test",
  "csm-feature",
  "ignored-tests",
  "lint-suppressions",
  "yaml-frontmatter",
  "storage-backend-capabilities",
  "quality-gates",
]

[[sensors]]
name = "fmt"
argv = ["cargo", "fmt", "--all", "--", "--check"]
inputs = ["**/*.rs", "rustfmt.toml"]

[[sensors]]
name = "check"
argv = ["cargo", "check", "--workspace"]
inputs = ["**/*.rs", "**/Cargo.toml", ".config/nextest.toml"]

[[sensors]]
name = "clippy"
argv = ["bash", "scripts/code-quality.sh", "clippy", "--workspace"]
inputs = ["**/*.rs", "**/Cargo.toml", ".clippy.toml", "scripts/code-quality.sh"]

# Normal unit + integration test suite. Matches CI test job selection:
# excludes benches/examples/test-utils to keep runtime stable and uses profile ci.
[[sensors]]
name = "test"
argv = [
  "cargo",
  "nextest",
  "run",
  "--profile",
  "ci",
  "--workspace",
  "--exclude",
  "do-memory-benches",
  "--exclude",
  "do-memory-examples",
  "--exclude",
  "do-memory-test-utils",
]
inputs = ["**/*.rs", "**/Cargo.toml", "tests/**", ".config/nextest.toml"]

# Dedicated CSM feature test suite matching CI csm-tests job (issue #1045).
[[sensors]]
name = "csm-feature"
argv = ["cargo", "nextest", "run", "--profile", "ci", "-p", "do-memory-core", "--features", "csm"]
inputs = ["**/*.rs", "**/Cargo.toml", ".config/nextest.toml"]

# Doctest execution and rustdoc build validation matching check-doctests.sh.
[[sensors]]
name = "docs"
argv = ["bash", "scripts/check-doctests.sh"]
inputs = ["**/*.rs", "scripts/check-doctests.sh"]

[[sensors]]
name = "deny"
argv = ["bash", "scripts/check-dependency-audit.sh"]
inputs = ["deny.toml", "**/Cargo.toml", "scripts/check-dependency-audit.sh"]

# Lockfile freshness for both graphs plus the libsql single-version alignment
# constraint. Without it a stale fuzz/Cargo.lock is only discovered when
# 'deny' rewrites it mid-scan (LESSON-077).
[[sensors]]
name = "lockfile-sync"
argv = ["bash", "scripts/check-lockfile-sync.sh"]
inputs = ["**/Cargo.toml", "fuzz/Cargo.lock", "scripts/check-lockfile-sync.sh"]

# Duplicate / misordered CHANGELOG version headings make parse-changelog reject
# the file, which is how a release shipped with empty notes (LESSON-066).
[[sensors]]
name = "changelog-headings"
argv = ["bash", "scripts/check-changelog-headings.sh"]
inputs = ["CHANGELOG.md", "scripts/check-changelog-headings.sh"]

# Bare ((i++)) under `set -e` exits 1 on the 0th increment and truncates the
# report it was writing (LESSON-059). Ratchet ceiling.
[[sensors]]
name = "shell-counters"
argv = ["bash", "scripts/check-shell-counters.sh"]
inputs = ["scripts/*.sh", "scripts/shell-counters-baseline.txt"]

# LESSONS.md pairs each entry with a routed note; nothing enforced it, so 41 of
# 77 lessons were unreachable from AGENTS.md/skills and one id was duplicated.
[[sensors]]
name = "lesson-distillation"
argv = ["bash", "scripts/check-lesson-distillation.sh"]
inputs = [
  "agent_docs/LESSONS.md",
  "AGENTS.md",
  ".agents/**/*.md",
  "scripts/check-lesson-distillation.sh",
  "scripts/lesson-distillation-baseline.txt",
]

# A CI control token in a commit message gives the branch zero runs, so the
# required aggregate can never report and the merge stays BLOCKED (LESSON-065).
# The sensor reads commit messages rather than file content. It still declares a
# file: an empty list is NOT "no inputs" - upstream treats `inputs.is_empty()` as
# the omitted case, records the same `input:git-index-and-nonignored-untracked`
# declaration, and in this workspace that digest resolves to null (measured on
# 0.4.1), which is the staleness this pack exists to remove.
[[sensors]]
name = "commit-ci-tokens"
argv = ["bash", "scripts/check-commit-ci-tokens.sh"]
inputs = ["scripts/check-commit-ci-tokens.sh"]

# A bare 10-15 digit run in AGENTS.md parks the required Codacy context at
# action_required with every other check green (LESSON-076).
[[sensors]]
name = "agents-md-ids"
argv = ["bash", "scripts/check-agents-md-ids.sh"]
inputs = ["AGENTS.md", "agent_docs/LESSONS.md", "scripts/check-agents-md-ids.sh"]

# Ruleset `main-protection` carries required_linear_history, so a `merge` commit
# is refused only while GitHub *executes* the merge - which cost a whole
# round-trip on PR #1241 (LESSON-081). Asserts merge-pr.sh's default method, its
# async stacked-PR path, and that no bypass is ever requested.
[[sensors]]
name = "merge-method"
argv = ["bash", "scripts/check-merge-method.sh"]
inputs = [
  "scripts/merge-pr.sh",
  "scripts/validate-gate-contract.sh",
  "scripts/check-merge-method.sh",
  ".github/**",
]

# The blocker gate only reads the tracker at ship time, so its classifier could
# rot silently and first surface on the release it was supposed to protect. This
# sensor runs the offline fixtures on every verification pass; the live read stays
# inside release-manager.sh, which refuses to ship with any open PR or open issue.
[[sensors]]
name = "release-blockers"
argv = ["bash", "scripts/check-release-blockers.sh", "--self-test"]
inputs = ["scripts/check-release-blockers.sh"]

# The docs name a pinned harness version and the completion contract is written as
# `do-harness verify --set verification --strict --record`. Nothing checked that the
# binary on PATH accepts those flags or emits the JSON agents parse, so a silent CLI
# change would read as a green run (LESSON-063). `--offline` skips the probe's own
# real-sensor step, which would otherwise run `cargo fmt` inside a run that already
# runs it; CI passes `--offline` too (its runner is cargo-free by design) and the
# doctrine sensor proves real execution on fixture sensors.
[[sensors]]
name = "harness-compat"
argv = ["bash", "scripts/check-do-harness-compat.sh", "--offline"]
inputs = [
  "scripts/do-harness-version.txt",
  "HARNESS.md",
  "AGENTS.md",
  ".agents/skills/harness/SKILL.md",
  "scripts/check-do-harness-compat.sh",
]

[[sensors]]
name = "harness-doctrine"
argv = ["bash", "scripts/check-do-harness-doctrine.sh"]
inputs = ["scripts/check-do-harness-doctrine.sh", "do-harness.toml"]

[[sensors]]
name = "loc"
argv = ["bash", "scripts/check-loc.sh"]
inputs = ["**/*.rs", "tests/**", "benches/**", "scripts/check-loc.sh", "scripts/quality-gates.sh"]

[[sensors]]
name = "ignored-tests"
argv = ["bash", "scripts/check-ignored-tests.sh"]
inputs = [
  "**/*.rs",
  "plans/ignored_tests_inventory.json",
  "scripts/check-ignored-tests.sh",
]

[[sensors]]
name = "lint-suppressions"
argv = ["bash", "scripts/check-lint-suppressions.sh"]
inputs = [
  "**/*.rs",
  "scripts/check-lint-suppressions.sh",
  "scripts/lint-suppressions-baseline.txt",
]

[[sensors]]
name = "yaml-frontmatter"
argv = ["bash", "scripts/check-yaml-frontmatter.sh"]
inputs = ["**/*.md", ".github/**", ".agents/**", "scripts/check-yaml-frontmatter.sh"]

[[sensors]]
name = "storage-backend-capabilities"
argv = ["bash", "scripts/check-storage-backend-capabilities.sh", "--check"]
inputs = [
  "**/*.rs",
  "docs/generated/storage-backend-capabilities.json",
  "scripts/storage-backend-capabilities.toml",
  "scripts/check-storage-backend-capabilities.sh",
]

# Quality gates runner. Sets QUALITY_GATE_SKIP_DOCTEST=true and QUALITY_GATE_SKIP_LOC=true
# because doctest validation and LOC checks are executed by dedicated sensors 'docs' and 'loc'.
[[sensors]]
name = "quality-gates"
argv = ["bash", "-c", "QUALITY_GATE_SKIP_DOCTEST=true QUALITY_GATE_SKIP_LOC=true scripts/quality-gates.sh"]
inputs = ["**/*.rs", "**/Cargo.toml", "tests/**", "benches/**", "scripts/quality-gates.sh"]
