[package]
name = "do-memory-storage-turso"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/d-o-hub/rust-self-learning-memory"
readme = "README.md"
description = "Turso/libSQL storage backend for the do-memory-core episodic learning system"
keywords = ["turso", "libsql", "storage", "database", "ai-memory"]
categories = ["database"]
documentation = "https://docs.rs/do-memory-storage-turso"

[features]
# Enable multi-dimension vector schema for Turso (Phase 0)
turso_multi_dimension = []
# Enable FTS5 hybrid search for enhanced retrieval
hybrid_search = []
# Enable keep-alive connection pool (reduces connection overhead from 45ms to ~5ms)
keepalive-pool = []
# Enable adaptive TTL cache for query result caching
adaptive-ttl = []

# Compression features for network bandwidth reduction (40% reduction target)
# Enable all compression algorithms (recommended for production)
compression = ["compression-lz4", "compression-zstd", "compression-gzip", "base64"]
# LZ4 compression - fast, low CPU overhead
compression-lz4 = ["lz4_flex"]
# Zstd compression - best compression ratio
compression-zstd = ["zstd"]
# Gzip compression - widely compatible
compression-gzip = ["flate2"]

[dependencies]
# Core dependencies
do-memory-core = { path = "../memory-core", version = "0.1.40", features = ["hybrid_search"] }
do-memory-storage-redb = { path = "../memory-storage-redb", version = "0.1.40" }

# Async runtime
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
postcard = { workspace = true }

 # Database
 libsql = { workspace = true }

# UUID and time
uuid = { workspace = true }
chrono = { workspace = true }

# Logging
tracing = { workspace = true }

# Synchronization
parking_lot = "0.12.5"

# Compression libraries (optional, enabled by compression feature)
# Using lz4_flex for safe LZ4 implementation (no unsafe code)
# lz4_flex 0.14 gates Vec-based block APIs behind `alloc` (via `std`).
lz4_flex = { version = "0.14", optional = true, default-features = false, features = ["std"] }
# Zstd for best compression ratio
zstd = { version = "0.14", optional = true }
# Flate2 for Gzip (uses miniz_oxide by default, no C dependency)
flate2 = { version = "1.1", optional = true, default-features = true, features = ["rust_backend"] }
# Base64 encoding for compressed data storage
base64 = { version = "0.23.0", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
futures = "0.3.32"
do-memory-test-utils = { path = "../test-utils", features = ["turso"] }
proptest = "1.11"

# Dimension-specific routing only exists in the `turso_multi_dimension` schema;
# the default build has a single `embeddings` table with F32_BLOB(384), where
# 1024/1536/3072/512 writes are rejected by the vector index. Keeping the target
# out of the build until the feature is on stops nightly from reporting a schema
# mismatch as a storage bug.
[[test]]
name = "multi_dimension_routing"
required-features = ["turso_multi_dimension"]

# Same schema requirement as `multi_dimension_routing`. Its per-test
# `cfg_attr(not(feature = ...), ignore)` guards are not enough on their own:
# nightly runs `--run-ignored only`, which forces ignored tests to execute.
[[test]]
name = "phase1_validation"
required-features = ["turso_multi_dimension"]

# Allow unsafe only for specific use cases

# Inherit workspace lints

[lints]
workspace = true
