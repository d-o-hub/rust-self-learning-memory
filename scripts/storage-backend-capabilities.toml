# StorageBackend capability inventory — hand-maintained classification overlay.
#
# `scripts/check-storage-backend-capabilities.sh` parses the trait source and
# requires every defaulted method to appear here, unless it is auto-classified
# as a capability declaration (a `supports_*`/`can_*` method whose default is
# `false`). A new defaulted method with no entry fails the check, so a faked
# success cannot be added silently. `--check` also verifies this overlay against
# the source bodies, so a declared classification cannot drift from the code.
#
# classification values:
#   required                             - no default body; every backend must implement it
#   capability-gated                     - gated by a declared capability predicate (`capability`)
#   value-returning-with-typed-fallback  - default returns Ok(())/None/empty/0/false/default
#   genuinely-safe-default               - default only delegates to a required method
#
# `gate_kind` (required for capability-gated):
#   predicate - the default is a no-op that callers must gate on `capability` (ADR-081 style)
#   error     - the default returns Error::CapabilityUnavailable (#1087 slices)
#
# `pending` records an in-flight slice that will move a method to capability-gated.
# It is documentation only: coverage and coherence rules still apply.

# ---------------------------------------------------------------------------
# Batch writes
# ---------------------------------------------------------------------------

[[method]]
name = "store_episodes_batch"
classification = "genuinely-safe-default"
justification = "Delegates every item to the required store_episode; it fabricates no result."

