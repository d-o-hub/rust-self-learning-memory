# ---------------------------------------------------------------------------
# Recommendation attribution (ADR-081) and ranking adaptation (ADR-082)
# ---------------------------------------------------------------------------

[[method]]
name = "store_recommendation_session"
classification = "capability-gated"
capability = "supports_recommendation_attribution"
gate_kind = "predicate"
justification = "ADR-081 no-op default; the checked persistence path counts it only when the predicate is true."

[[method]]
name = "get_recommendation_session"
classification = "capability-gated"
capability = "supports_recommendation_attribution"
gate_kind = "predicate"
justification = "ADR-081: only callers that gated on the predicate may treat the None as an authoritative miss."

[[method]]
name = "get_recommendation_session_for_episode"
classification = "capability-gated"
capability = "supports_recommendation_attribution"
gate_kind = "predicate"
justification = "ADR-081: the no-op default is not durable history, so callers must gate on the predicate."

[[method]]
name = "store_recommendation_feedback"
classification = "capability-gated"
capability = "supports_recommendation_attribution"
gate_kind = "predicate"
justification = "ADR-081 no-op default; the checked persistence path counts it only when the predicate is true."

[[method]]
name = "get_recommendation_feedback"
classification = "capability-gated"
capability = "supports_recommendation_attribution"
gate_kind = "predicate"
justification = "ADR-081: the None default must not be read as durable absence without the predicate."

[[method]]
name = "get_recommendation_stats"
classification = "capability-gated"
capability = "supports_recommendation_attribution"
gate_kind = "predicate"
justification = "ADR-081: default stats are zeroed, not computed; the predicate gates their interpretation."

[[method]]
name = "list_recommendation_sessions"
classification = "capability-gated"
capability = "supports_ranking_adaptation"
gate_kind = "predicate"
justification = "ADR-082: the empty default contributes nothing; the ranking rebuild skips unadvertised backends."

[[method]]
name = "list_recommendation_feedback"
classification = "capability-gated"
capability = "supports_ranking_adaptation"
gate_kind = "predicate"
justification = "ADR-082: the empty default contributes nothing; the ranking rebuild skips unadvertised backends."

